name: ios

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'patches/**'
      - 'scripts/**'
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 版本只有一处来源：project.yml 的 MARKETING_VERSION。
      # 发版时 tag 必须与它一致（v0.2.0 ↔ 0.2.0），否则在这里停下，
      # 免得 Release 上挂着一个和 App 内部版本对不上的包。
      - name: Resolve version
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^[[:space:]]+MARKETING_VERSION:' project.yml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$VERSION" ]; then
            echo "::error::project.yml 里找不到 MARKETING_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "版本: $VERSION"
          if [ "${GITHUB_EVENT_NAME}" = "release" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 project.yml 的 MARKETING_VERSION ${VERSION} 不一致"
            exit 1
          fi

      - name: Toolchain
        run: |
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Unit tests (simulator)
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for r in d for x in d[r] if x['name'].startswith('iPhone')), ''))")
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator on this runner - skipping unit tests."
            exit 0
          fi
          echo "Simulator: $UDID"
          set +e
          xcodebuild test -project DeepSeekBot.xcodeproj -scheme DeepSeekBot -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::测试失败摘要"
            grep -E "error:|XCTAssert|Test Case .* failed|Testing failed|TEST FAILED|Failed to build" test.log | head -80 || true
            echo "::endgroup::"
            exit "$status"
          fi
          tail -4 test.log

      # build 号 = 运行序号，所以同一个 MARKETING_VERSION 下的包也能分辨先后。
      - name: Build device app (no signing)
        run: |
          xcodebuild build -project DeepSeekBot.xcodeproj -scheme DeepSeekBot -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CURRENT_PROJECT_VERSION="${{ github.run_number }}" -quiet

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/DeepSeekBot.app"
          test -d "$APP"
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          NAME="DeepSeekBot-${VERSION}-unsigned.ipa"
          zip -qry "$NAME" Payload
          rm -rf Payload
          shasum -a 256 "$NAME" | tee "${NAME}.sha256"
          ls -lh "$NAME" "${NAME}.sha256"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekBot-${{ env.VERSION }}-unsigned-ipa
          path: |
            out/*.ipa
            out/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.ipa
            out/*.sha256
